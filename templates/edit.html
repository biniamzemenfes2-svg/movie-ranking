{% extends 'base.html' %}

{% block title %}Edit Movies{% endblock %}

{% block content %}
<div class="content">
  <h1 class="heading">Movie Title</h1>
    <p class="description">Edit Movie Rating</p>
  </div>
  <form action="{{ url_for("edit")}} method="post"">
    <label>your rating out of 10 e.g </label>
    <input type="text" name="rating" placeholder="7.3" required>
    <label>your review</label>
    <input type="text" name="review" placeholder="My favourite character was the caller." required>
    <button type="submit" class="button">Update</button>
  </form>
{% endblock %}
